local_backend: true

backend:
  name: git-gateway
  branch: decap
  
media_folder: "assets/images"

collections:
  - label: "Pages"
    name: "pages"
    files:
      - label: "Home page"
        name: "home"
        file: "index.md"
        fields:
          - {
              label: "Meta Title",
              name: "meta_title",
              widget: "string"
            }
          - {
              label: "Page Title",
              name: "title",
              widget: "string"
            }
          - {
              label: "Heading",
              name: "heading",
              widget: "string"
            }